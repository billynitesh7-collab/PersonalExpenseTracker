# Keep this independent local server separate from the legacy app on port 8000.
server.port=${PORT:8081}

# Database credentials and URL are supplied by environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DATABASE_USERNAME:expense_tracker}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true

# Server-side session cookie: Secure is enabled in the production profile.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
